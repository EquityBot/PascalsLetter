name: Snyk

# Snyk runs weekly and when a dependency file changes, which keeps it inside
# the free plan's monthly test allowance.
on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - "**/Cargo.lock"
      - "**/Cargo.toml"
      - ".github/workflows/snyk.yml"
  pull_request:
    paths:
      - "**/Cargo.lock"
      - "**/Cargo.toml"
      - ".github/workflows/snyk.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Snyk Rust dependencies (${{ matrix.root }})
    # Pull requests from forks, and Dependabot's (which get Dependabot secrets
    # only), receive no SNYK_TOKEN; the weekly run on develop scans their changes.
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # proxy/ is its own workspace with its own Cargo.lock.
        root: [".", proxy]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
      # Snyk cannot read Cargo.lock directly, so the graph is described as a
      # CycloneDX SBOM and tested with `snyk sbom test`.
      - name: Install the SBOM generator
        run: |
          rustup toolchain install 1.91 --profile minimal
          rustup default 1.91
          cargo install cargo-cyclonedx --locked --version 0.5.9
      # `snyk sbom test` does not apply .snyk, so the root .snyk's ignores are
      # applied here, for both workspaces: a finding is dropped when .snyk ignores
      # its ID for every path ('*') with an `expires` still to come. Without a
      # .snyk nothing is ignored. Snyk exiting above 1 (an error), or output the
      # filter cannot read, fails the job.
      - name: Test the Cargo graph
        working-directory: ${{ matrix.root }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set -o pipefail
          # cargo-cyclonedx writes one SBOM beside each workspace member's
          # manifest; each is tested.
          cargo cyclonedx --format json --spec-version 1.5 --override-filename snyk-sbom
          [ -n "$SNYK_TOKEN" ] || { echo "::error::The SNYK_TOKEN repository secret is not set, so nothing was scanned."; exit 1; }
          mapfile -t sboms < <(find . -name snyk-sbom.json -not -path './target/*' | sort)
          [ "${#sboms[@]}" -gt 0 ] || { echo "::error::cargo-cyclonedx wrote no SBOM."; exit 1; }
          # {"<ID>": "<latest unexpired expires>"} for each ID .snyk ignores everywhere.
          policy=$GITHUB_WORKSPACE/.snyk
          ignored='{}'
          if [ -f "$policy" ]; then
            ignored=$(yq -o=json '.ignore // {}' "$policy" | jq -c '
              with_entries(.value = ([.value[] | .["*"]? | .expires? // empty
                | select((sub("\\.[0-9]+"; "") | fromdateiso8601) > now)] | max))
              | with_entries(select(.value != null))')
          fi
          report=$RUNNER_TEMP/snyk.json
          # Tests one SBOM and prints each finding as open or ignored; fails on an
          # open finding or a result it cannot read.
          sbom_test() {
            local code=0 findings open
            echo "== $1"
            snyk sbom test --experimental --json --file="$1" > "$report" || code=$?
            if [ "$code" -gt 1 ] || [ ! -s "$report" ]; then
              cat "$report"; echo
              echo "::error::snyk sbom test failed on $1 (exit $code)."
              return 1
            fi
            # One line per vulnerable path, `open` or `ignored`.
            if ! findings=$(jq -r --argjson ignored "$ignored" '
              if type == "array" then .[] else . end
              | if (.vulnerabilities | type) == "array" then .vulnerabilities[]
                else error("no vulnerabilities list in the Snyk output") end
              | $ignored[.id] as $until
              | "\(if $until then "ignored" else "open" end) [\(.severity // "?" | ascii_upcase)] \(.title) (\(.id)) in \(.packageName)@\(.version) via \(.from // [] | join(" > "))\(if $until then ", ignored until \($until)" else "" end)"
            ' "$report"); then
              cat "$report"; echo
              echo "::error::Could not read the Snyk results for $1."
              return 1
            fi
            [ -z "$findings" ] || printf '%s\n' "$findings"
            open=$(printf '%s\n' "$findings" | grep -c '^open ' || true)
            if [ "$open" -gt 0 ]; then
              echo "::error::$open open Snyk finding(s) in $1."
              return 1
            elif [ "$code" -eq 1 ] && [ -z "$findings" ]; then
              cat "$report"; echo
              echo "::error::Snyk failed $1 without listing a vulnerability."
              return 1
            fi
          }
          status=0
          for sbom in "${sboms[@]}"; do
            sbom_test "$sbom" || status=1
          done
          exit "$status"
